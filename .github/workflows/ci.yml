name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+ and Node.js
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: true

      - name: Run Vite+ checks
        run: vp check

      - name: Run ESLint and React Compiler checks
        run: vp exec eslint .

      - name: Run tests
        run: vp test

      - name: Build production application
        run: vp run build
